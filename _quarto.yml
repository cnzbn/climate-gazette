project:
  type: website
  output-dir: docs        # GitHub Pages will serve from /docs
  resources:
       - images/
       - CNAME
  pre-render: 
       - fix_hr.py
       - clean_notebooks.py

website:
  title: "Climate Gazette"
  navbar:
      search: false
      logo: images/logo-gazette.svg
      logo-alt: "Climate Gazette"
      logo-href: "index.qmd"
      title: false
      


format:
  html:
    page-layout: full
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    code-fold: false
    echo: false  
    execute: 
      echo: false
    filters:
      - hide-text-output.lua
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
   

    



